<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AcouAgent · 执行看板</title>
<style>
  :root {
    --bg: #eef1f5;
    --surface: #ffffff;
    --surface-2: #edf1f5;
    --border: #d5dae2;
    --border-strong: #aab5c2;
    --text: #111827;
    --muted: #6b7280;
    --accent: #2563eb;
    --accent-soft: #eff6ff;
    --green: #047857;
    --green-soft: #ecfdf5;
    --red: #b91c1c;
    --red-soft: #fef2f2;
    --yellow: #b45309;
    --yellow-soft: #fffbeb;
    --purple: #6d28d9;
    --purple-soft: #f5f3ff;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; padding: 24px; line-height: 1.5; }
  .top-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; padding: 14px 18px; background: var(--surface); border: 1px solid var(--border-strong); border-radius: 10px; box-shadow: 0 1px 2px rgba(17,24,39,.08); flex-wrap: wrap; gap: 12px; }
  .top-bar h1 { font-size: 20px; font-weight: 650; letter-spacing: 0; }
  .top-bar h1 span { color: var(--muted); font-weight: 450; }
  .top-bar .subtitle { font-size: 12px; color: var(--muted); margin-top: 3px; }
  .top-bar .nav-links { display: flex; gap: 8px; flex-wrap: wrap; }
  .top-bar .nav-links a { color: var(--muted); text-decoration: none; font-size: 13px; padding: 6px 10px; border: 1px solid var(--border-strong); border-radius: 7px; background: var(--surface); }
  .top-bar .nav-links a:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
  .top-bar .nav-links a.active { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); font-weight: 600; }

  .stats { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 12px; margin-bottom: 16px; }
  .stat { background: var(--surface); border: 1px solid var(--border-strong); border-radius: 10px; padding: 12px 14px; min-width: 0; text-align: left; box-shadow: 0 1px 2px rgba(17,24,39,.08); display: flex; flex-direction: column; gap: 2px; }
  .stat .stat-top { display: flex; align-items: center; gap: 6px; }
  .stat .stat-top svg { width: 16px; height: 16px; flex-shrink: 0; }
  .stat .num { font-size: 22px; font-weight: 700; line-height: 1.2; }
  .stat .label { font-size: 12px; color: var(--muted); }
  .stat.success .num { color: var(--green); }
  .stat.fail .num { color: var(--red); }
  .stat.timeout .num { color: var(--yellow); }
  .stat.rate .num { color: var(--accent); }
  .stat.avg .num { color: var(--purple); }
  .stat.retry .num { color: var(--yellow); }
  .stat.fail-alert { border-color: var(--red); box-shadow: 0 0 0 2px var(--red-soft); }
  .stat.fail-alert .num { color: var(--red); }

  .table-wrap { background: var(--surface); border: 1px solid var(--border-strong); border-radius: 10px; overflow: hidden; box-shadow: 0 2px 6px rgba(17,24,39,.08); }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; padding: 10px 14px; background: #dfe5ec; color: #374151; font-weight: 650; font-size: 12px; position: sticky; top: 0; z-index: 1; border-bottom: 1px solid var(--border-strong); }
  td { padding: 10px 14px; border-top: 1px solid #cdd5df; vertical-align: middle; }
  tr:nth-child(even) { background: #f7f9fb; }
  tr:hover { background: var(--accent-soft); }
  tr.date-row td { background: #e9edf3; color: var(--muted); font-size: 12px; font-weight: 600; padding: 6px 14px; border-top: 1px solid var(--border-strong); }
  .code-cell { max-width: 460px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: "SF Mono","Fira Code",monospace; font-size: 12px; color: #334155; cursor: pointer; }
  .code-cell:hover { color: var(--accent); }
  .badge { display: inline-flex; align-items: center; gap: 4px; padding: 3px 8px; border-radius: 6px; font-size: 12px; font-weight: 600; border: 1px solid transparent; }
  .badge svg { width: 12px; height: 12px; }
  .badge-ok { background: var(--green-soft); color: var(--green); border-color: #a7f3d0; }
  .badge-err { background: var(--red-soft); color: var(--red); border-color: #fecaca; }
  .badge-to { background: var(--yellow-soft); color: var(--yellow); border-color: #fde68a; }
  .badge-warn { background: var(--purple-soft); color: var(--purple); border-color: #ddd6fe; }
  .metric-cell { white-space: nowrap; font-family: "SF Mono","Fira Code",monospace; font-size: 12px; color: #374151; }
  .metric-pill { display: inline-block; padding: 2px 8px; border-radius: 6px; font-weight: 600; }
  .metric-pill.ok { background: var(--green-soft); color: var(--green); }
  .metric-pill.warn { background: var(--purple-soft); color: var(--purple); }
  .metric-pill.na { color: var(--muted); }
  .time { color: var(--muted); font-size: 12px; white-space: nowrap; }
  .dur { font-size: 12px; text-align: right; white-space: nowrap; }

  .toolbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 0 0 12px 0; }
  .toolbar input, .toolbar select { padding: 7px 10px; border-radius: 6px; border: 1px solid var(--border-strong); background: var(--surface); color: var(--text); font-size: 12px; }
  .toolbar input { min-width: 220px; }
  .toolbar select { min-width: 120px; }
  .toolbar .compare-hint { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  .compare-hint.active { color: var(--accent); font-weight: 600; }

  .action-btn { padding: 4px 8px; border-radius: 6px; border: 1px solid var(--border-strong); background: var(--surface); color: var(--muted); cursor: pointer; font-size: 11px; }
  .action-btn:hover { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }
  .action-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .result-img { width: 48px; height: 36px; object-fit: cover; border-radius: 5px; border: 1px solid var(--border-strong); background: var(--surface-2); cursor: zoom-in; }
  .empty { text-align: center; padding: 56px 20px; color: var(--muted); }
  .empty .icon { font-size: 32px; margin-bottom: 8px; opacity: .65; }
  .empty .cta { margin-top: 14px; display: inline-block; padding: 8px 16px; border-radius: 8px; background: var(--accent); color: #fff; text-decoration: none; font-size: 13px; font-weight: 500; }
  .empty .cta:hover { opacity: .9; }

  .detail-row { display: none; }
  .detail-row.open { display: table-row; }
  .detail-row td { padding: 0 14px 14px 14px; border-top: 1px solid #cdd5df; background: #f3f6f9; }
  .detail-box { background: #f4f7fa; border: 1px solid var(--border-strong); border-radius: 6px; padding: 12px; font-size: 12px; font-family: "SF Mono","Fira Code",monospace; white-space: pre-wrap; word-break: break-all; max-height: 240px; overflow-y: auto; color: #1f2937; }
  .detail-box.code { color: #1e3a8a; }
  .detail-box.code.expanded { max-height: none; }
  .detail-box .code-empty { color: var(--muted); font-style: italic; }
  .expand-btn { display: inline-flex; align-items: center; gap: 4px; margin-left: auto; padding: 4px 10px; border-radius: 6px; border: 1px solid var(--border-strong); background: var(--surface); color: var(--muted); cursor: pointer; font-size: 11px; }
  .expand-btn:hover { color: var(--text); border-color: var(--accent); background: var(--accent-soft); }
  .detail-tabs { display: flex; gap: 4px; margin-bottom: 8px; align-items: center; }
  .detail-tab { padding: 5px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; border: 1px solid var(--border-strong); background: var(--surface); color: var(--muted); }
  .detail-tab.active { background: var(--accent); color: #fff; border-color: var(--accent); }

  .refresh { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; margin-bottom: 12px; }
  .refresh .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); }
  .refresh .clear-btn { margin-left: 16px; padding: 4px 10px; border-radius: 6px; border: 1px solid var(--red); color: var(--red); background: var(--surface); cursor: pointer; font-size: 12px; }
  .refresh .clear-btn:hover { background: var(--red-soft); }

  .fail-analysis { background: var(--surface); border: 1px solid var(--border-strong); border-radius: 10px; margin-top: 16px; overflow: hidden; box-shadow: 0 2px 6px rgba(17,24,39,.08); }
  .fail-analysis.has-failures { border-color: var(--red); box-shadow: 0 0 0 2px var(--red-soft); }
  .fa-header { padding: 12px 16px; border-bottom: 1px solid var(--border-strong); font-weight: 600; font-size: 14px; display: flex; align-items: center; gap: 8px; background: #f7f9fb; }
  .fa-header span { color: var(--muted); font-weight: 400; font-size: 12px; }
  .fa-groups { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 12px; padding: 14px 16px; }
  .fa-group { border: 1px solid var(--border-strong); border-radius: 8px; overflow: hidden; background: #fff; }
  .fa-group-head { padding: 8px 12px; font-size: 13px; font-weight: 600; display: flex; justify-content: space-between; align-items: center; }
  .fa-group.timeout .fa-group-head { color: var(--yellow); background: var(--yellow-soft); }
  .fa-group.exit .fa-group-head { color: var(--red); background: var(--red-soft); }
  .fa-group.zero .fa-group-head { color: var(--purple); background: var(--purple-soft); }
  .fa-count { background: rgba(17,24,39,.06); border-radius: 10px; padding: 0 8px; font-size: 12px; }
  .fa-items { max-height: 240px; overflow-y: auto; }
  .fa-item { padding: 7px 12px; font-size: 12px; border-top: 1px solid #cdd5df; cursor: pointer; color: var(--muted); display: flex; gap: 8px; align-items: center; }
  .fa-item:hover { background: var(--accent-soft); color: var(--text); }
  .fa-item .fa-id { color: var(--muted); flex-shrink: 0; }
  .fa-item .fa-summary { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .fa-item .fa-time { flex-shrink: 0; color: var(--muted); font-size: 11px; }
  .fa-empty { padding: 14px; font-size: 12px; color: var(--muted); text-align: center; }

  .pagination { display: flex; align-items: center; justify-content: flex-end; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--border); font-size: 12px; color: var(--muted); }
  .pagination button { padding: 5px 12px; border-radius: 6px; border: 1px solid var(--border-strong); background: var(--surface); color: var(--text); cursor: pointer; font-size: 12px; }
  .pagination button:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  .pagination button:disabled { opacity: 0.4; cursor: not-allowed; }
  .pagination .page-info { margin-right: auto; }

  .modal-mask { position: fixed; inset: 0; background: rgba(17,24,39,.45); display: flex; align-items: center; justify-content: center; z-index: 10000; }
  .modal { background: var(--surface); border: 1px solid var(--border-strong); border-radius: 12px; padding: 22px 24px; max-width: 400px; width: 90%; box-shadow: 0 20px 50px rgba(0,0,0,.25); }
  .modal h3 { font-size: 16px; margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
  .modal p { font-size: 13px; color: var(--muted); margin-bottom: 18px; line-height: 1.6; }
  .modal .modal-actions { display: flex; justify-content: flex-end; gap: 10px; }
  .modal .btn { padding: 7px 16px; border-radius: 8px; border: 1px solid var(--border-strong); background: var(--surface); color: var(--text); cursor: pointer; font-size: 13px; }
  .modal .btn-danger { background: var(--red); border-color: var(--red); color: #fff; }
  .modal .btn-danger:hover { opacity: .9; }

  @media (max-width: 1100px) { .stats { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
  @media (max-width: 768px) {
    body { padding: 12px; }
    .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .code-cell { max-width: 180px; }
    th:nth-child(1), td:nth-child(1) { display: none; }
    .dur, .metric-cell { display: none; }
    .toolbar input { min-width: 100%; }
  }
</style>
</head>
<body>

<div class="top-bar">
  <div>
    <h1>AcouAgent <span>执行看板</span></h1>
    <div class="subtitle">实时查看声学仿真的执行记录、关键结果与失败分析</div>
  </div>
  <div class="nav-links">
    <a href="/">门户</a>
    <a href="/dashboard" class="active">执行看板</a>
    <a href="/cache">纠错缓存</a>
  </div>
</div>

<div class="refresh"><span class="dot" id="live-dot"></span><span id="refresh-text">自动刷新中</span><button class="clear-btn" onclick="openClearConfirm()" title="清空所有执行历史">清空历史</button></div>

<div class="toolbar">
  <input id="search-input" type="search" placeholder="搜索代码、错误或结果..." oninput="applyFilters()">
  <select id="status-filter" onchange="applyFilters()">
    <option value="all">全部状态</option>
    <option value="success">成功</option>
    <option value="failed">失败</option>
    <option value="timeout">超时</option>
    <option value="zero">全零</option>
  </select>
  <span style="color:var(--muted);font-size:12px" id="filter-count">0 条</span>
  <span class="compare-hint" id="compare-hint">勾选两条记录进行对比（已选 <b id="compare-num">0</b>/2）</span>
</div>

<div class="stats" id="stats">
  <div class="stat"><div class="stat-top"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 12l2 2 4-4"/><circle cx="12" cy="12" r="9"/></svg></div><div class="num" id="stat-total">-</div><div class="label">总执行</div></div>
  <div class="stat success"><div class="stat-top"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6L9 17l-5-5"/></svg></div><div class="num" id="stat-ok">-</div><div class="label">成功</div></div>
  <div class="stat fail"><div class="stat-top"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg></div><div class="num" id="stat-fail">-</div><div class="label">失败</div></div>
  <div class="stat timeout"><div class="stat-top"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg></div><div class="num" id="stat-to">-</div><div class="label">超时</div></div>
  <div class="stat rate"><div class="stat-top"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg></div><div class="num" id="stat-rate">-</div><div class="label">成功率</div></div>
  <div class="stat avg"><div class="stat-top"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg></div><div class="num" id="stat-avg">-</div><div class="label">平均耗时</div></div>
  <div class="stat retry"><div class="stat-top"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 11-2.64-6.36M21 3v6h-6"/></svg></div><div class="num" id="stat-retry">-</div><div class="label">重试率</div></div>
</div>

<div class="fail-analysis" id="fail-analysis" style="display:none">
  <div class="fa-header"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--red)" stroke-width="2"><path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9L1.8 18a2 2 0 001.7 3h17a2 2 0 001.7-3L13.7 3.9a2 2 0 00-3.4 0z"/></svg> 失败分析 <span>最近失败记录按类型归类，点击展开详情</span></div>
  <div class="fa-groups">
    <div class="fa-group timeout">
      <div class="fa-group-head">超时 <span class="fa-count" id="fa-count-timeout">0</span></div>
      <div class="fa-items" id="fa-items-timeout"><div class="fa-empty">暂无</div></div>
    </div>
    <div class="fa-group exit">
      <div class="fa-group-head">退出码非 0 <span class="fa-count" id="fa-count-exit">0</span></div>
      <div class="fa-items" id="fa-items-exit"><div class="fa-empty">暂无</div></div>
    </div>
    <div class="fa-group zero">
      <div class="fa-group-head">结果异常（全零） <span class="fa-count" id="fa-count-zero">0</span></div>
      <div class="fa-items" id="fa-items-zero"><div class="fa-empty">暂无</div></div>
    </div>
  </div>
</div>

<div class="table-wrap" style="margin-top:16px">
  <div id="compare-panel" style="display:none;margin-bottom:14px"></div>
  <table>
    <thead><tr>
      <th title="勾选两条记录对比">对比</th><th>#</th><th>时间</th><th>状态</th><th class="metric-cell">关键结果</th><th class="dur">耗时</th><th>操作</th>
    </tr></thead>
    <tbody id="rows"><tr><td colspan="7" class="empty"><div class="icon">暂无记录</div>等待 Dify 发送第一条代码...</td></tr></tbody>
  </table>
  <div class="pagination" id="pagination" style="display:none"></div>
</div>

<div id="modal-root"></div>

<script>
var lastId = 0;
var firstLoad = true;
var pageSize = 20;
var currentPage = 1;
var filteredIds = [];

function esc(s) { return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function dateGroup(ts) {
  var d = new Date(ts);
  var today = new Date(); today.setHours(0,0,0,0);
  var yest = new Date(); yest.setDate(yest.getDate()-1); yest.setHours(0,0,0,0);
  var day = new Date(d); day.setHours(0,0,0,0);
  if (day.getTime() === today.getTime()) return '今天';
  if (day.getTime() === yest.getTime()) return '昨天';
  return d.toLocaleDateString("zh-CN", { year:"numeric", month:"2-digit", day:"2-digit" });
}

function fmtTime(ts) {
  var d = new Date(ts);
  return d.toLocaleString("zh-CN", { month:"2-digit", day:"2-digit", hour:"2-digit", minute:"2-digit", second:"2-digit" });
}

function smartSummary(code) {
  var lines = code.split("\n");
  var meaningful = '';
  for (var i = 0; i < lines.length; i++) {
    var line = lines[i].trim();
    if (!line) continue;
    if (/^(import |from |#!|\/\/)/.test(line)) continue;
    if (/^#/.test(line)) continue;
    meaningful = line;
    break;
  }
  if (!meaningful && lines.length > 0) {
    for (var j = 0; j < lines.length; j++) {
      var l = lines[j].trim();
      if (l && !/^#!/.test(l)) { meaningful = l; break; }
    }
  }
  if (!meaningful) meaningful = lines[0] || '';
  if (meaningful.length > 100) meaningful = meaningful.slice(0, 100) + '…';
  return meaningful;
}

function maxPressureOf(r) {
  var m = /最大压力[：:]?\s*\**\s*([\d.eE+-]+)/.exec(r.stdout || '');
  return m ? parseFloat(m[1]) : null;
}

function badge(r) {
  if (r.timed_out) return '<span class="badge badge-to">超时</span>';
  if (r.exit_code !== 0) return '<span class="badge badge-err">失败 (' + r.exit_code + ')</span>';
  var mp = maxPressureOf(r);
  if (mp !== null && mp === 0) return '<span class="badge badge-warn">全零</span>';
  return '<span class="badge badge-ok">成功</span>';
}

function metricCell(r) {
  var mp = maxPressureOf(r);
  if (mp === null) return '<span class="metric-pill na">-</span>';
  if (mp === 0) return '<span class="metric-pill warn">全零</span>';
  return '<span class="metric-pill ok">' + mp.toFixed(4) + ' Pa</span>';
}

function copyCode(id) {
  var r = window.__execs[id];
  if (!r || !r.code) return;
  navigator.clipboard.writeText(r.code).then(function() {
    showToast('代码已复制');
  }).catch(function() {
    window.prompt('复制代码', r.code);
  });
}

function downloadRecord(id) {
  var r = window.__execs[id];
  if (!r) return;
  var blob = new Blob([JSON.stringify(r, null, 2)], {type: 'application/json'});
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'execution-' + id + '.json';
  a.click();
  URL.revokeObjectURL(a.href);
}

async function rerunExecution(id) {
  var btn = event.currentTarget || event.srcElement;
  if (btn) {
    btn.disabled = true;
    btn.textContent = '运行中…';
  }
  try {
    var resp = await fetch('/dashboard/api/rerun', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({id: id})
    });
    var data = await resp.json();
    if (!data.ok) {
      showToast('重跑失败：' + (data.error || '未知错误'), true);
      return;
    }
    var r = data.result || {};
    var ok = r.exit_code === 0 && !r.timed_out;
    showToast(ok ? '重跑成功 · 耗时 ' + (r.duration_ms != null ? r.duration_ms + 'ms' : '-') : '重跑结束 · 退出码 ' + r.exit_code, !ok);
    refresh();
  } catch(e) {
    showToast('重跑失败：' + e, true);
  } finally {
    if (btn) {
      btn.disabled = false;
      btn.textContent = '重跑';
    }
  }
}

function showToast(msg, isError) {
  var el = document.getElementById('toast');
  if (!el) {
    el = document.createElement('div');
    el.id = 'toast';
    el.style.cssText = 'position:fixed;right:16px;bottom:16px;padding:10px 16px;border-radius:8px;font-size:13px;z-index:10001;box-shadow:0 8px 24px rgba(0,0,0,.18);transition:opacity .2s;';
    document.body.appendChild(el);
  }
  el.textContent = msg;
  el.style.background = isError ? '#b91c1c' : '#111827';
  el.style.color = '#fff';
  clearTimeout(window.__toastTimer);
  window.__toastTimer = setTimeout(function(){ el.remove(); }, 2600);
}

function renderRow(r) {
  var dur = r.duration_ms != null ? (r.duration_ms < 1000 ? r.duration_ms+"ms" : (r.duration_ms/1000).toFixed(1)+"s") : "-";
  var hasImg = r.image_base64 && r.image_base64.length > 100;
  var summary = smartSummary(r.code || '');
  var imgDot = hasImg
    ? '<span class="img-dot" title="有图像" onclick="event.stopPropagation();showLightbox(\'data:image/png;base64,' + r.image_base64 + '\')"></span>'
    : '';
  var imgHtml = hasImg ? '<img class="result-img" src="data:image/png;base64,' + r.image_base64 + '" onclick="event.stopPropagation();showLightbox(this.src)" title="查看图像">' : '<span style="color:var(--muted)">无图</span>';
  var actions = '<button class="action-btn" onclick="event.stopPropagation();copyCode(' + r.id + ')" title="复制代码">复制</button>' +
    '<button class="action-btn" onclick="event.stopPropagation();downloadRecord(' + r.id + ')" title="导出 JSON">导出</button>' +
    '<button class="action-btn" onclick="event.stopPropagation();rerunExecution(' + r.id + ')" title="重新运行">重跑</button>';
  var codeSummary = r.code ? esc(summary) : '<span class="code-empty">（结果分析 · 无代码）</span>';
  var codeDetail = r.code
    ? '<div class="detail-box code" id="codebox-' + r.id + '">' + esc(r.code) + '</div>'
    : '<div class="detail-box code"><span class="code-empty">（该工具不执行代码，仅分析上一步仿真输出）</span></div>';
  var expandBtn = r.code && r.code.split("\n").length > 12
    ? '<button class="expand-btn" onclick="event.stopPropagation();toggleCodeExpand(' + r.id + ')">↕ 展开/收起</button>'
    : '';

  return '<tr onclick="toggleDetail(' + r.id + ')" style="cursor:pointer">'
    + '<td><input type="checkbox" class="cmp-cb" data-id="' + r.id + '" title="选择对比" onclick="event.stopPropagation();onCompareToggle(this)"></td>'
    + '<td style="color:var(--muted);font-size:12px">' + r.id + '</td>'
    + '<td class="time" title="' + r.timestamp + '">' + fmtTime(r.timestamp) + '</td>'
    + '<td>' + badge(r) + '</td>'
    + '<td class="metric-cell">' + metricCell(r) + '</td>'
    + '<td class="dur">' + dur + '</td>'
    + '<td>' + imgHtml + ' ' + actions + '</td>'
    + '</tr>'
    + '<tr class="detail-row" id="detail-' + r.id + '"><td colspan="7">'
    + '<div class="detail-tabs">'
    + '<span class="detail-tab active" onclick="event.stopPropagation();switchTab(' + r.id + ',\'code\')">代码</span>'
    + '<span class="detail-tab" onclick="event.stopPropagation();switchTab(' + r.id + ',\'stdout\')">stdout</span>'
    + '<span class="detail-tab" onclick="event.stopPropagation();switchTab(' + r.id + ',\'stderr\')">stderr</span>'
    + expandBtn
    + '</div>'
    + '<div class="detail-section active" id="sec-' + r.id + '-code">' + codeDetail + '</div>'
    + '<div class="detail-section" id="sec-' + r.id + '-stdout"><div class="detail-box stdout">' + (esc(r.stdout) || "(无输出)") + '</div></div>'
    + '<div class="detail-section" id="sec-' + r.id + '-stderr"><div class="detail-box stderr">' + (esc(r.stderr) || "(无输出)") + '</div></div>'
    + '</td></tr>';
}

function toggleDetail(id) { document.getElementById("detail-" + id).classList.toggle("open"); }

function toggleCodeExpand(id) {
  var box = document.getElementById("codebox-" + id);
  if (!box) return;
  box.classList.toggle("expanded");
}

// ===== 结果对比 =====
var compareSel = [];
window.__execs = window.__execs || {};

function onCompareToggle(cb) {
  var id = parseInt(cb.dataset.id, 10);
  if (cb.checked) {
    if (compareSel.length >= 2) {
      cb.checked = false;
      showToast('最多勾选 2 条记录进行对比', true);
      return;
    }
    compareSel.push(id);
  } else {
    compareSel = compareSel.filter(function(x) { return x !== id; });
  }
  updateCompareHint();
  renderCompare();
}

function updateCompareHint() {
  document.getElementById('compare-num').textContent = compareSel.length;
  var hint = document.getElementById('compare-hint');
  hint.classList.toggle('active', compareSel.length > 0);
}

function _cmpStatus(r) {
  if (r.timed_out) return '超时';
  if (r.exit_code !== 0) return '失败(' + r.exit_code + ')';
  var mp = maxPressureOf(r);
  if (mp !== null && mp === 0) return '全零';
  return '成功';
}
function _cmpMaxP(r) { var m = maxPressureOf(r); return m != null ? m : '-'; }
function _cmpDur(r) {
  if (r.duration_ms == null) return '-';
  return r.duration_ms < 1000 ? r.duration_ms + 'ms' : (r.duration_ms / 1000).toFixed(1) + 's';
}

function renderCompare() {
  var box = document.getElementById('compare-panel');
  if (compareSel.length < 2) { if (box) box.style.display = 'none'; return; }
  var a = window.__execs[compareSel[0]];
  var b = window.__execs[compareSel[1]];
  if (!a || !b) return;
  var row = function(k, va, vb) {
    return '<tr><td style="padding:6px 12px;color:var(--muted)">' + k + '</td><td style="padding:6px 12px">' + (va == null || va === '' ? '-' : va) + '</td><td style="padding:6px 12px">' + (vb == null || vb === '' ? '-' : vb) + '</td></tr>';
  };
  var hasImg = function(r) { return r.image_base64 && r.image_base64.length > 100 ? '有' : '无'; };
  box.innerHTML =
    '<div style="background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px 16px">'
    + '<div style="font-weight:600;margin-bottom:10px;color:var(--accent);display:flex;align-items:center;gap:8px">结果对比 <span style="font-weight:400;color:var(--muted);font-size:12px">#' + a.id + ' vs #' + b.id + '</span></div>'
    + '<table style="width:100%;border-collapse:collapse;font-size:13px">'
    + '<tr style="background:#e9edf3"><th style="padding:6px 12px;text-align:left;border:1px solid var(--border)">指标</th>'
    + '<th style="padding:6px 12px;text-align:left;border:1px solid var(--border)">#' + a.id + ' · ' + (a.tool_name || '执行') + '</th>'
    + '<th style="padding:6px 12px;text-align:left;border:1px solid var(--border)">#' + b.id + ' · ' + (b.tool_name || '执行') + '</th></tr>'
    + row('状态', _cmpStatus(a), _cmpStatus(b))
    + row('耗时', _cmpDur(a), _cmpDur(b))
    + row('尝试次数', a.attempt_count != null ? a.attempt_count : 1, b.attempt_count != null ? b.attempt_count : 1)
    + row('最大压力 (Pa)', _cmpMaxP(a), _cmpMaxP(b))
    + row('图像', hasImg(a), hasImg(b))
    + '</table></div>';
  box.style.display = 'block';
}

function switchTab(id, tab) {
  ["code","stdout","stderr"].forEach(function(t) { document.getElementById("sec-"+id+"-"+t).classList.toggle("active", t===tab); });
  var tabs = document.querySelectorAll("#detail-"+id+" .detail-tab");
  tabs.forEach(function(el,i) { el.classList.toggle("active", ["code","stdout","stderr"][i]===tab); });
}

// ===== 失败分析 =====
function classifyFailure(r) {
  if (r.timed_out) return 'timeout';
  if (r.exit_code !== 0) return 'exit';
  var mp = maxPressureOf(r);
  if (mp !== null && mp === 0) return 'zero';
  return null;
}

function revealFailure(id) {
  var detailRow = document.getElementById('detail-' + id);
  if (detailRow) {
    detailRow.classList.add('open');
    detailRow.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }
}

function _faItem(r) {
  var summary = r.code ? smartSummary(r.code) : '（结果分析 · 无代码）';
  return '<div class="fa-item" onclick="revealFailure(' + r.id + ')" title="点击展开详情">'
    + '<span class="fa-id">#' + r.id + '</span>'
    + '<span class="fa-summary">' + esc(summary) + '</span>'
    + '<span class="fa-time">' + fmtTime(r.timestamp) + '</span>'
    + '</div>';
}

function renderFailAnalysis() {
  var ids = Object.keys(window.__execs || {});
  var buckets = { timeout: [], exit: [], zero: [] };
  ids.forEach(function(id) {
    var r = window.__execs[id];
    var cls = classifyFailure(r);
    if (cls) buckets[cls].push(r);
  });
  var any = false;
  ['timeout', 'exit', 'zero'].forEach(function(cls) {
    var list = buckets[cls];
    list.sort(function(a, b) { return b.id - a.id; });
    document.getElementById('fa-count-' + cls).textContent = list.length;
    var box = document.getElementById('fa-items-' + cls);
    if (list.length) {
      any = true;
      box.innerHTML = list.slice(0, 20).map(_faItem).join('');
    } else {
      box.innerHTML = '<div class="fa-empty">暂无</div>';
    }
  });
  var fa = document.getElementById('fail-analysis');
  fa.style.display = any ? 'block' : 'none';
  fa.classList.toggle('has-failures', any);
}

function _statusKey(r) {
  if (r.timed_out) return 'timeout';
  if (r.exit_code !== 0) return 'failed';
  var mp = maxPressureOf(r);
  if (mp !== null && mp === 0) return 'zero';
  return 'success';
}

function getFilteredIds() {
  var q = (document.getElementById('search-input').value || '').toLowerCase();
  var status = document.getElementById('status-filter').value;
  var ids = Object.keys(window.__execs || {}).map(Number).sort(function(a, b) { return b - a; });
  return ids.filter(function(id) {
    var r = window.__execs[id];
    if (status !== 'all' && _statusKey(r) !== status) return false;
    if (!q) return true;
    var hay = [r.code, r.stdout, r.stderr, r.tool_name, String(r.id)].join(' ').toLowerCase();
    return hay.indexOf(q) !== -1;
  });
}

function renderPagination() {
  var total = filteredIds.length;
  var totalPages = Math.max(1, Math.ceil(total / pageSize));
  if (currentPage > totalPages) currentPage = totalPages;
  var pg = document.getElementById('pagination');
  if (total <= pageSize) { pg.style.display = 'none'; return; }
  pg.style.display = 'flex';
  pg.innerHTML = '<span class="page-info">共 ' + total + ' 条 · 第 ' + currentPage + ' / ' + totalPages + ' 页</span>'
    + '<button onclick="gotoPage(1)" ' + (currentPage === 1 ? 'disabled' : '') + '>首页</button>'
    + '<button onclick="gotoPage(' + (currentPage-1) + ')" ' + (currentPage === 1 ? 'disabled' : '') + '>上一页</button>'
    + '<button onclick="gotoPage(' + (currentPage+1) + ')" ' + (currentPage === totalPages ? 'disabled' : '') + '>下一页</button>'
    + '<button onclick="gotoPage(' + totalPages + ')" ' + (currentPage === totalPages ? 'disabled' : '') + '>末页</button>';
}

function gotoPage(p) {
  currentPage = p;
  renderRows();
  renderPagination();
}

function renderRows() {
  var rowsBox = document.getElementById('rows');
  if (!filteredIds.length) {
    rowsBox.innerHTML = '<tr><td colspan="7" class="empty"><div class="icon">📭</div>没有符合当前筛选条件的记录。<br><a class="cta" href="/">去门户发起一次仿真</a></td></tr>';
    return;
  }
  var start = (currentPage - 1) * pageSize;
  var pageIds = filteredIds.slice(start, start + pageSize);
  var html = '';
  var lastGroup = '';
  pageIds.forEach(function(id) {
    var r = window.__execs[id];
    var g = dateGroup(r.timestamp);
    if (g !== lastGroup) {
      html += '<tr class="date-row"><td colspan="7">' + g + '</td></tr>';
      lastGroup = g;
    }
    html += renderRow(r);
  });
  rowsBox.innerHTML = html;
}

function applyFilters() {
  filteredIds = getFilteredIds();
  currentPage = 1;
  document.getElementById('filter-count').textContent = filteredIds.length + ' 条';
  renderRows();
  renderPagination();
}

function updateStats(stats) {
  var total = stats.total || 0;
  var success = stats.success || 0;
  document.getElementById("stat-total").textContent = total;
  document.getElementById("stat-ok").textContent = success;
  document.getElementById("stat-fail").textContent = stats.failed || 0;
  document.getElementById("stat-to").textContent = stats.timeout || 0;
  document.getElementById("stat-rate").textContent = total ? (success / total * 100).toFixed(1) + '%' : '-';

  var durations = [], retries = 0, withAttempt = 0;
  Object.keys(window.__execs || {}).forEach(function(id) {
    var r = window.__execs[id];
    if (r.duration_ms != null) durations.push(r.duration_ms);
    if (r.attempt_count != null) { withAttempt++; if (r.attempt_count > 1) retries++; }
  });
  var avg = durations.length ? (durations.reduce(function(a,b){return a+b;}, 0) / durations.length) : 0;
  document.getElementById("stat-avg").textContent = avg ? (avg < 1000 ? Math.round(avg) + 'ms' : (avg/1000).toFixed(1) + 's') : '-';
  document.getElementById("stat-retry").textContent = withAttempt ? (retries / withAttempt * 100).toFixed(0) + '%' : '-';

  var hasFail = (stats.failed || 0) + (stats.timeout || 0) > 0;
  ['stat-fail', 'stat-to'].forEach(function(id) {
    document.getElementById(id).parentElement.classList.toggle('fail-alert', hasFail);
  });
}

async function refresh() {
  try {
    var resp = await fetch("/dashboard/api/executions?since=" + lastId + "&limit=100");
    var data = await resp.json();
    if (data.executions && data.executions.length > 0) {
      data.executions.forEach(function(r) { window.__execs[r.id] = r; });
      lastId = Math.max(lastId, Math.max.apply(null, data.executions.map(function(r) { return r.id; })));
    }
    if (data.stats) updateStats(data.stats);
    renderFailAnalysis();
    applyFilters();
    document.getElementById("live-dot").style.background = "var(--green)";
    document.getElementById("refresh-text").textContent = "自动刷新中";
  } catch(e) {
    document.getElementById("live-dot").style.background = "var(--red)";
    document.getElementById("refresh-text").textContent = "连接断开";
  }
}

document.addEventListener('click', function(e) {
  var img = e.target.closest('.gallery-thumb');
  if (!img) return;
  e.stopPropagation();
  showLightbox(img.src);
});

function showLightbox(src) {
  var old = document.getElementById('gallery-lightbox');
  if (old) old.remove();
  var lb = document.createElement('div');
  lb.id = 'gallery-lightbox';
  lb.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.9);z-index:9999;display:flex;align-items:center;justify-content:center;cursor:pointer;';
  lb.onclick = function() { lb.remove(); };
  var inner = document.createElement('img');
  inner.src = src;
  inner.style.cssText = 'max-width:90%;max-height:90%;border-radius:8px;box-shadow:0 0 40px rgba(0,0,0,0.5);';
  lb.appendChild(inner);
  document.body.appendChild(lb);
  document.addEventListener('keydown', function escFn(ev) { if (ev.key === 'Escape') { lb.remove(); document.removeEventListener('keydown', escFn); } });
}

function openClearConfirm() {
  var root = document.getElementById('modal-root');
  root.innerHTML = '<div class="modal-mask" onclick="if(event.target===this)closeClearConfirm()">'
    + '<div class="modal">'
    + '<h3>清空执行历史</h3>'
    + '<p>确定要清空所有执行记录吗？此操作<strong style="color:var(--red)">不可撤销</strong>，清空后无法恢复。</p>'
    + '<div class="modal-actions">'
    + '<button class="btn" onclick="closeClearConfirm()">取消</button>'
    + '<button class="btn btn-danger" onclick="confirmClearHistory()">确认清空</button>'
    + '</div></div></div>';
}

function closeClearConfirm() { document.getElementById('modal-root').innerHTML = ''; }

async function confirmClearHistory() {
  closeClearConfirm();
  try {
    var resp = await fetch('/dashboard/api/executions', { method: 'DELETE' });
    var data = await resp.json();
    if (data.ok) {
      window.__execs = {};
      lastId = 0;
      firstLoad = true;
      compareSel = [];
      updateCompareHint();
      renderCompare();
      showToast('已清空 ' + data.deleted + ' 条记录');
      refresh();
    }
  } catch(e) {
    showToast('清空失败：' + e, true);
  }
}

refresh();
setInterval(refresh, 3000);
</script>
</body>
</html>
