<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dify MCP - 执行看板</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; padding: 24px; line-height: 1.5; }
  .top-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; padding: 12px 16px; background: var(--surface); border: 1px solid var(--border-strong); border-radius: 8px; box-shadow: 0 1px 2px rgba(17,24,39,.08); flex-wrap: wrap; gap: 12px; }
  .top-bar h1 { font-size: 20px; font-weight: 650; letter-spacing: 0; }
  .top-bar h1 span { color: var(--muted); font-weight: 450; }
  .top-bar .nav-links { display: flex; gap: 8px; flex-wrap: wrap; }
  .top-bar .nav-links a { color: var(--muted); text-decoration: none; font-size: 13px; padding: 6px 10px; border: 1px solid var(--border-strong); border-radius: 7px; background: var(--surface); }
  .top-bar .nav-links a:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
  .stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-bottom: 16px; }
  .stat { background: var(--surface); border: 1px solid var(--border-strong); border-radius: 8px; padding: 12px 16px; min-width: 0; text-align: left; box-shadow: 0 1px 2px rgba(17,24,39,.08); }
  .stat .num { font-size: 24px; font-weight: 700; line-height: 1.2; }
  .stat .label { font-size: 12px; color: var(--muted); margin-top: 3px; }
  .stat.success .num { color: var(--green); }
  .stat.fail .num { color: var(--red); }
  .stat.timeout .num { color: var(--yellow); }
  .table-wrap { background: var(--surface); border: 1px solid var(--border-strong); border-radius: 8px; overflow: hidden; box-shadow: 0 2px 6px rgba(17,24,39,.08); }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; padding: 10px 14px; background: var(--surface-2); color: var(--text); font-weight: 650; font-size: 12px; position: sticky; top: 0; z-index: 1; border-bottom: 1px solid var(--border-strong); }
  td { padding: 10px 14px; border-top: 1px solid var(--border); vertical-align: middle; }
  tr:nth-child(even) { background: var(--surface-2); }
  tr:hover { background: var(--accent-soft); }
  .code-cell { max-width: 460px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: "SF Mono","Fira Code",monospace; font-size: 12px; color: var(--muted); cursor: pointer; }
  .code-cell:hover { color: var(--accent); }
  .code-cell .img-dot { display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--green); margin-left:6px; vertical-align:middle; }
  .badge { display: inline-flex; align-items: center; gap: 5px; padding: 3px 8px; border-radius: 6px; font-size: 12px; font-weight: 600; border: 1px solid transparent; }
  .badge-ok { background: var(--green-soft); color: var(--green); }
  .badge-err { background: var(--red-soft); color: var(--red); }
  .badge-to { background: var(--yellow-soft); color: var(--yellow); }
  .badge-warn { background: var(--purple-soft); color: var(--purple); }
  .time { color: var(--muted); font-size: 12px; white-space: nowrap; }
  .dur { font-size: 12px; text-align: right; white-space: nowrap; }
  .toolbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 0 0 12px 0; }
  .toolbar input, .toolbar select { padding: 7px 10px; border-radius: 6px; border: 1px solid var(--border-strong); background: var(--surface); color: var(--text); font-size: 12px; }
  .toolbar input { min-width: 220px; }
  .toolbar select { min-width: 120px; }
  .admin-token-wrap { display: inline-flex; align-items: center; gap: 6px; margin-left: auto; color: var(--muted); font-size: 12px; }
  .admin-token-wrap input { min-width: 180px; }
  .analysis-summary { font-family: inherit; white-space: normal; word-break: break-word; line-height: 1.65; }
  .analysis-summary dl { display: grid; grid-template-columns: 110px 1fr; gap: 6px 12px; margin-bottom: 10px; }
  .analysis-summary dt { color: var(--muted); }
  .analysis-summary dd { margin: 0; }
  .action-btn { padding: 4px 8px; border-radius: 6px; border: 1px solid var(--border-strong); background: var(--surface); color: var(--muted); cursor: pointer; font-size: 11px; }
  .action-btn:hover { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }
  .result-img { width: 48px; height: 36px; object-fit: cover; border-radius: 5px; border: 1px solid var(--border-strong); background: var(--surface-2); cursor: zoom-in; }
  .metric-cell { white-space: nowrap; font-family: "SF Mono","Fira Code",monospace; font-size: 12px; color: var(--muted); }
  .empty { text-align: center; padding: 56px; color: var(--muted); }
  .empty .icon { font-size: 32px; margin-bottom: 8px; opacity: .65; }
  .detail-row { display: none; }
  .detail-row.open { display: table-row; }
  .detail-row td { padding: 0 14px 14px 14px; border-top: 1px solid var(--border); background: var(--surface-2); }
  .detail-box { background: var(--surface-2); border: 1px solid var(--border-strong); border-radius: 6px; padding: 12px; font-size: 12px; font-family: "SF Mono","Fira Code",monospace; white-space: pre-wrap; word-break: break-all; max-height: 240px; overflow-y: auto; color: var(--text); }
  .detail-box.code { color: var(--blue); }
  .detail-box.code.expanded { max-height: none; }
  .detail-box .code-empty { color: var(--muted); font-style: italic; }
  .expand-btn { display: inline-flex; align-items: center; gap: 4px; margin-left: auto; padding: 4px 10px; border-radius: 6px; border: 1px solid var(--border-strong); background: var(--surface); color: var(--muted); cursor: pointer; font-size: 11px; }
  .expand-btn:hover { color: var(--text); border-color: var(--accent); background: var(--accent-soft); }
  .detail-tabs { display: flex; gap: 4px; margin-bottom: 8px; align-items: center; }
  .detail-tab { padding: 5px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; border: 1px solid var(--border-strong); background: var(--surface); color: var(--muted); }
  .detail-tab.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .detail-section { display: none; }
  .detail-section.active { display: block; }
  .refresh { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; margin-bottom: 12px; }
  .refresh .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); }
  .fail-analysis { background: var(--surface); border: 1px solid var(--border-strong); border-radius: 8px; margin-top: 16px; overflow: hidden; box-shadow: 0 2px 6px rgba(17,24,39,.08); }
  .fa-header { padding: 12px 16px; border-bottom: 1px solid var(--border-strong); font-weight: 600; font-size: 14px; display: flex; align-items: center; gap: 8px; background: var(--surface-2); }
  .fa-header span { color: var(--muted); font-weight: 400; font-size: 12px; }
  .fa-groups { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 12px; padding: 14px 16px; }
  .fa-group { border: 1px solid var(--border-strong); border-radius: 8px; overflow: hidden; background: var(--surface); }
  .fa-group-head { padding: 8px 12px; font-size: 13px; font-weight: 600; display: flex; justify-content: space-between; align-items: center; }
  .fa-group.timeout .fa-group-head { color: var(--yellow); background: var(--yellow-soft); }
  .fa-group.exit .fa-group-head { color: var(--red); background: var(--red-soft); }
  .fa-group.zero .fa-group-head { color: var(--purple); background: var(--purple-soft); }
  .fa-count { background: var(--surface-2); border-radius: 10px; padding: 0 8px; font-size: 12px; }
  .fa-items { max-height: 240px; overflow-y: auto; }
  .fa-item { padding: 7px 12px; font-size: 12px; border-top: 1px solid var(--border); cursor: pointer; color: var(--muted); display: flex; gap: 8px; align-items: center; }
  .fa-item:hover { background: var(--accent-soft); color: var(--text); }
  .fa-item .fa-id { color: var(--muted); flex-shrink: 0; }
  .fa-item .fa-summary { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .fa-item .fa-time { flex-shrink: 0; color: var(--muted); font-size: 11px; }
  .fa-empty { padding: 14px; font-size: 12px; color: var(--muted); text-align: center; }
  @media (max-width: 768px) {
    body { padding: 12px; }
    .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .code-cell { max-width: 180px; }
    th:nth-child(1), td:nth-child(1) { display: none; }
    .dur, .metric-cell { display: none; }
    .toolbar input { min-width: 100%; }
    .admin-token-wrap { width: 100%; margin-left: 0; flex-wrap: wrap; }
    .admin-token-wrap input { flex: 1; min-width: 0; }
  }
</style>
</head>
<body>

<div class="top-bar">
  <h1>AcouAgent <span>执行看板</span></h1>
  <div class="nav-links">
    <a href="/">门户</a>
    <a href="/cache">纠错缓存</a>
  </div>
</div>

<div class="refresh"><span class="dot" id="live-dot"></span><span id="refresh-text">自动刷新中</span><span style="margin-left:16px;color:var(--red);cursor:pointer;font-size:12px" onclick="clearHistory()" title="清空所有执行历史">清空历史</span></div>

<div class="toolbar">
  <input id="search-input" type="search" placeholder="搜索代码、错误或结果..." oninput="applyFilters()">
  <select id="status-filter" onchange="applyFilters()">
    <option value="all">全部状态</option>
    <option value="success">成功</option>
    <option value="failed">失败</option>
    <option value="timeout">超时</option>
    <option value="zero">全零</option>
  </select>
  <span style="color:var(--muted);font-size:12px" id="filter-count">0 条</span>
  <label class="admin-token-wrap" for="admin-token">
    管理员令牌
    <input id="admin-token" type="password" autocomplete="off" placeholder="仅本页内存，不保存">
  </label>
</div>

<div class="stats" id="stats">
  <div class="stat"><div class="num" id="stat-total">-</div><div class="label">总执行</div></div>
  <div class="stat success"><div class="num" id="stat-ok">-</div><div class="label">成功</div></div>
  <div class="stat fail"><div class="num" id="stat-fail">-</div><div class="label">失败</div></div>
  <div class="stat timeout"><div class="num" id="stat-to">-</div><div class="label">超时</div></div>
</div>

<div class="fail-analysis" id="fail-analysis" style="display:none">
  <div class="fa-header">失败分析 <span>最近失败记录按类型归类，点击展开详情</span></div>
  <div class="fa-groups">
    <div class="fa-group timeout">
      <div class="fa-group-head">超时 <span class="fa-count" id="fa-count-timeout">0</span></div>
      <div class="fa-items" id="fa-items-timeout"><div class="fa-empty">暂无</div></div>
    </div>
    <div class="fa-group exit">
      <div class="fa-group-head">退出码非 0 <span class="fa-count" id="fa-count-exit">0</span></div>
      <div class="fa-items" id="fa-items-exit"><div class="fa-empty">暂无</div></div>
    </div>
    <div class="fa-group zero">
      <div class="fa-group-head">结果异常（全零） <span class="fa-count" id="fa-count-zero">0</span></div>
      <div class="fa-items" id="fa-items-zero"><div class="fa-empty">暂无</div></div>
    </div>
  </div>
</div>

<div class="table-wrap" style="margin-top:16px">
  <div id="compare-panel" style="display:none;margin-bottom:14px"></div>
  <table>
    <thead><tr>
      <th title="勾选两条记录对比">对比</th><th>#</th><th>时间</th><th>状态</th><th class="metric-cell">关键结果</th><th class="dur">耗时</th><th>操作</th>
    </tr></thead>
    <tbody id="rows"><tr><td colspan="7" class="empty"><div class="icon">暂无记录</div>等待 Dify 发送第一条代码...</td></tr></tbody>
  </table>
</div>

<script>
var lastId = 0;
var lastAnalysisId = 0;
var firstLoad = true;
var detailState = Object.create(null);

function timeAgo(ts) {
  var d = new Date(ts), now = new Date();
  var s = Math.floor((now - d) / 1000);
  var relative;
  if (s < 60) relative = s + "秒前";
  else if (s < 3600) relative = Math.floor(s/60) + "分钟前";
  else relative = Math.floor(s/3600) + "小时前";
  var dateStr = d.toLocaleString("zh-CN", { month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",second:"2-digit" });
  return relative + " (" + dateStr + ")";
}

function esc(s) { return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function smartSummary(code) {
  var lines = code.split("\n");
  var meaningful = '';
  for (var i = 0; i < lines.length; i++) {
    var line = lines[i].trim();
    if (!line) continue;
    // 跳过 import/from/shebang 与纯注释行（# 开头），取第一条实质代码
    if (/^(import |from |#!|\/\/)/.test(line)) continue;
    if (/^#/.test(line)) continue;
    meaningful = line;
    break;
  }
  // If nothing left (all imports/comments), use the first non-empty non-shebang line
  if (!meaningful && lines.length > 0) {
    for (var j = 0; j < lines.length; j++) {
      var l = lines[j].trim();
      if (l && !/^#!/.test(l)) { meaningful = l; break; }
    }
  }
  if (!meaningful) meaningful = lines[0] || '';
  // Truncate to 100 chars
  if (meaningful.length > 100) meaningful = meaningful.slice(0, 100) + '…';
  return meaningful;
}

function badge(r) {
  if (r.timed_out) return '<span class="badge badge-to">超时</span>';
  if (r.exit_code !== 0) return '<span class="badge badge-err">失败 (' + r.exit_code + ')</span>';
  var m = /最大压力[：:]?\s*\**\s*([\d.eE+-]+)/.exec(r.stdout || '');
  if (m && parseFloat(m[1]) === 0) return '<span class="badge badge-warn">全零</span>';
  return '<span class="badge badge-ok">成功</span>';
}

function copyCode(id) {
  var r = window.__execs[id];
  if (!r || !r.code) return;
  navigator.clipboard.writeText(r.code).then(function() {
    showToast('代码已复制');
  }).catch(function() {
    window.prompt('复制代码', r.code);
  });
}

function downloadRecord(id) {
  var r = window.__execs[id];
  if (!r) return;
  var blob = new Blob([JSON.stringify(r, null, 2)], {type: 'application/json'});
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'execution-' + id + '.json';
  a.click();
  URL.revokeObjectURL(a.href);
}

function adminHeaders(withJson) {
  var token = document.getElementById('admin-token').value.trim();
  if (!token) {
    document.getElementById('admin-token').focus();
    showToast('请输入管理员令牌');
    return null;
  }
  var headers = {'X-Admin-Token': token};
  if (withJson) headers['Content-Type'] = 'application/json';
  return headers;
}

async function rerunExecution(id, btn) {
  var headers = adminHeaders(true);
  if (!headers) return;
  if (btn) {
    btn.disabled = true;
    btn.textContent = '运行中';
  }
  try {
    var resp = await fetch('/dashboard/api/rerun', {
      method: 'POST',
      headers: headers,
      body: JSON.stringify({id: id})
    });
    var data = await resp.json();
    if (!data.ok) {
      alert(data.error || '重跑失败');
      return;
    }
    var r = data.result || {};
    alert('重跑完成\n耗时: ' + (r.duration_ms != null ? r.duration_ms + 'ms' : '-') + '\n退出码: ' + (r.exit_code != null ? r.exit_code : '-'));
    refresh();
  } catch(e) {
    alert('重跑失败：' + e);
  } finally {
    if (btn) {
      btn.disabled = false;
      btn.textContent = '重跑';
    }
  }
}

function showToast(msg) {
  var el = document.getElementById('toast');
  if (!el) {
    el = document.createElement('div');
    el.id = 'toast';
    el.style.cssText = 'position:fixed;right:16px;bottom:16px;background:#111827;color:#fff;padding:8px 12px;border-radius:6px;font-size:12px;z-index:9999';
    document.body.appendChild(el);
  }
  el.textContent = msg;
  clearTimeout(window.__toastTimer);
  window.__toastTimer = setTimeout(function(){ el.remove(); }, 1800);
}

function renderRow(r) {
  var state = detailState[r.id] || {open:false, tab:r.analysis ? 'report' : 'code', codeExpanded:false};
  detailState[r.id] = state;
  var dur = r.duration_ms != null ? (r.duration_ms < 1000 ? r.duration_ms+"ms" : (r.duration_ms/1000).toFixed(1)+"s") : "-";
  var hasImg = r.image_base64 && r.image_base64.length > 100;
  var summary = smartSummary(r.code || '');
  var imgDot = hasImg
    ? '<span class="img-dot" title="有图像" onclick="event.stopPropagation();showLightbox(\'data:image/png;base64,' + r.image_base64 + '\')"></span>'
    : '';
  var maxPressure = '';
  var mp = /最大压力[：:]?\s*\**\s*([\d.eE+-]+)/.exec(r.stdout || '');
  if (mp) maxPressure = Number(mp[1]).toFixed(4);
  var metric = maxPressure ? maxPressure + ' Pa' : '-';
  var imgHtml = hasImg ? '<img class="result-img" src="data:image/png;base64,' + r.image_base64 + '" onclick="event.stopPropagation();showLightbox(this.src)" title="查看图像">' : '<span style="color:var(--muted)">无图</span>';
  var actions = '<button class="action-btn" onclick="event.stopPropagation();copyCode(' + r.id + ')" title="复制代码">复制</button>' +
    '<button class="action-btn" onclick="event.stopPropagation();downloadRecord(' + r.id + ')" title="导出 JSON">导出</button>' +
    '<button class="action-btn" onclick="event.stopPropagation();rerunExecution(' + r.id + ',this)" title="重新运行">重跑</button>';
  if (r.skill_reference && typeof r.skill_reference.skill_id === 'string' && Number.isSafeInteger(r.skill_reference.version)) {
    var skillHref = '/skills?skill_id=' + encodeURIComponent(r.skill_reference.skill_id) + '&version=' + encodeURIComponent(r.skill_reference.version);
    actions += '<a class="action-btn skill-evidence-link" href="' + skillHref + '" onclick="event.stopPropagation()" title="查看本次已验证固定配方的技能证据">技能证据 v' + r.skill_reference.version + '</a>';
  }
  // 无代码工具（analyze_simulation_result 等）显示占位说明，不再空白
  var codeSummary = r.code ? esc(summary) : '<span class="code-empty">（结果分析 · 无代码）</span>';
  var codeDetail = r.code
    ? '<div class="detail-box code' + (state.codeExpanded ? ' expanded' : '') + '" id="codebox-' + r.id + '">' + esc(r.code) + '</div>'
    : '<div class="detail-box code"><span class="code-empty">（该工具不执行代码，仅分析上一步仿真输出）</span></div>';
  var expandBtn = r.code && r.code.split("\n").length > 12
    ? '<button class="expand-btn" onclick="event.stopPropagation();toggleCodeExpand(' + r.id + ')">展开/收起</button>'
    : '';

  return '<tr onclick="toggleDetail(' + r.id + ')" style="cursor:pointer">'
    + '<td><input type="checkbox" class="cmp-cb" data-id="' + r.id + '" title="选择对比" onclick="event.stopPropagation();onCompareToggle(this)"></td>'
    + '<td style="color:var(--muted);font-size:12px">' + r.id + '</td>'
    + '<td class="time" title="' + r.timestamp + '">' + timeAgo(r.timestamp) + '</td>'
    + '<td>' + badge(r) + '</td>'
    + '<td class="metric-cell">' + metric + '</td>'
    + '<td class="dur">' + dur + '</td>'
    + '<td>' + imgHtml + ' ' + actions + '</td>'
    + '</tr>'
    + '<tr class="detail-row' + (state.open ? ' open' : '') + '" id="detail-' + r.id + '"><td colspan="7">'
    + '<div class="detail-tabs">'
    + '<span class="detail-tab' + (state.tab === 'report' ? ' active' : '') + '" onclick="event.stopPropagation();switchTab(' + r.id + ',\'report\')">结论</span>'
    + '<span class="detail-tab' + (state.tab === 'code' ? ' active' : '') + '" onclick="event.stopPropagation();switchTab(' + r.id + ',\'code\')">代码</span>'
    + '<span class="detail-tab' + (state.tab === 'stdout' ? ' active' : '') + '" onclick="event.stopPropagation();switchTab(' + r.id + ',\'stdout\')">stdout</span>'
    + '<span class="detail-tab' + (state.tab === 'stderr' ? ' active' : '') + '" onclick="event.stopPropagation();switchTab(' + r.id + ',\'stderr\')">stderr</span>'
    + expandBtn
    + '</div>'
    + '<div class="detail-section' + (state.tab === 'report' ? ' active' : '') + '" id="sec-' + r.id + '-report">' + renderAnalysis(r.analysis) + '</div>'
    + '<div class="detail-section' + (state.tab === 'code' ? ' active' : '') + '" id="sec-' + r.id + '-code">' + codeDetail + '</div>'
    + '<div class="detail-section' + (state.tab === 'stdout' ? ' active' : '') + '" id="sec-' + r.id + '-stdout"><div class="detail-box stdout">' + (esc(r.stdout) || "(无输出)") + '</div></div>'
    + '<div class="detail-section' + (state.tab === 'stderr' ? ' active' : '') + '" id="sec-' + r.id + '-stderr"><div class="detail-box stderr">' + (esc(r.stderr) || "(无输出)") + '</div></div>'
    + '</td></tr>';
}

function renderAnalysis(a) {
  if (!a) return '<div class="detail-box analysis-summary">本次记录没有可关联的物理分析摘要。</div>';
  var shape = Array.isArray(a.field_shape) && a.field_shape.length ? a.field_shape.join(' × ') : '-';
  var maxPressure = a.max_pressure == null ? '-' : Number(a.max_pressure).toPrecision(6) + ' Pa';
  var rmsPressure = a.rms_pressure == null ? '-' : Number(a.rms_pressure).toPrecision(6) + ' Pa';
  return '<div class="detail-box analysis-summary"><dl>'
    + '<dt>物理判定</dt><dd>' + esc(a.verdict || '-') + '</dd>'
    + '<dt>最大压力</dt><dd>' + esc(maxPressure) + '</dd>'
    + '<dt>RMS 压力</dt><dd>' + esc(rmsPressure) + '</dd>'
    + '<dt>场形状</dt><dd>' + esc(shape) + '</dd>'
    + '<dt>检测到信号</dt><dd>' + (a.has_signal ? '是' : '否') + '</dd>'
    + '</dl><strong>确定性分析摘要</strong><p>' + esc(a.summary || '暂无摘要') + '</p></div>';
}

function toggleDetail(id) {
  var row = document.getElementById("detail-" + id);
  row.classList.toggle("open");
  var state = detailState[id] || {open:false, tab:'code', codeExpanded:false};
  state.open = row.classList.contains("open");
  detailState[id] = state;
}

function toggleCodeExpand(id) {
  var box = document.getElementById("codebox-" + id);
  if (!box) return;
  box.classList.toggle("expanded");
  var state = detailState[id] || {open:true, tab:'code', codeExpanded:false};
  state.codeExpanded = box.classList.contains("expanded");
  detailState[id] = state;
}

// ===== P0-3 结果对比：勾选两条执行记录，对比工具/状态/耗时/尝试/最大压力/图像 =====
var compareSel = [];
window.__execs = window.__execs || {};

function onCompareToggle(cb) {
  var id = parseInt(cb.dataset.id, 10);
  if (cb.checked) {
    if (compareSel.length >= 2) {
      cb.checked = false;
      alert('最多勾选 2 条记录进行对比');
      return;
    }
    compareSel.push(id);
  } else {
    compareSel = compareSel.filter(function(x) { return x !== id; });
  }
  renderCompare();
}

function _cmpStatus(r) {
  if (r.timed_out) return '超时';
  if (r.exit_code !== 0) return '失败(' + r.exit_code + ')';
  var m = /最大压力[：:]?\s*\**\s*([\d.eE+-]+)/.exec(r.stdout || '');
  if (m && parseFloat(m[1]) === 0) return '全零';
  return '成功';
}
function _cmpMaxP(r) {
  var m = /最大压力[：:]?\s*\**\s*([\d.eE+-]+)/.exec(r.stdout || '');
  return m ? m[1] : '-';
}
function _cmpDur(r) {
  if (r.duration_ms == null) return '-';
  return r.duration_ms < 1000 ? r.duration_ms + 'ms' : (r.duration_ms / 1000).toFixed(1) + 's';
}

function renderCompare() {
  var box = document.getElementById('compare-panel');
  if (compareSel.length < 2) { if (box) box.style.display = 'none'; return; }
  var a = window.__execs[compareSel[0]];
  var b = window.__execs[compareSel[1]];
  if (!a || !b) return;
  var row = function(k, va, vb) {
    return '<tr><td>' + k + '</td><td>' + (va == null || va === '' ? '-' : va) + '</td><td>' + (vb == null || vb === '' ? '-' : vb) + '</td></tr>';
  };
  var hasImg = function(r) { return r.image_base64 && r.image_base64.length > 100 ? '有' : '无'; };
  box.innerHTML =
    '<div style="background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px 16px">'
    + '<div style="font-weight:600;margin-bottom:10px;color:var(--blue)">结果对比 <span style="font-weight:400;color:var(--muted);font-size:12px">（勾选两条记录）</span></div>'
    + '<table style="width:100%;border-collapse:collapse;font-size:13px">'
    + '<tr style="background:var(--surface-2)"><th style="padding:6px 12px;text-align:left;border:1px solid var(--border)">指标</th>'
    + '<th style="padding:6px 12px;text-align:left;border:1px solid var(--border)">#' + a.id + ' · ' + (a.tool_name || '执行') + '</th>'
    + '<th style="padding:6px 12px;text-align:left;border:1px solid var(--border)">#' + b.id + ' · ' + (b.tool_name || '执行') + '</th></tr>'
    + row('状态', _cmpStatus(a), _cmpStatus(b))
    + row('耗时', _cmpDur(a), _cmpDur(b))
    + row('尝试次数', a.attempt_count != null ? a.attempt_count : 1, b.attempt_count != null ? b.attempt_count : 1)
    + row('最大压力 (Pa)', _cmpMaxP(a), _cmpMaxP(b))
    + row('图像', hasImg(a), hasImg(b))
    + '</table></div>';
  box.style.display = 'block';
}

function switchTab(id, tab) {
  ["report","code","stdout","stderr"].forEach(function(t) { document.getElementById("sec-"+id+"-"+t).classList.toggle("active", t===tab); });
  var tabs = document.querySelectorAll("#detail-"+id+" .detail-tab");
  tabs.forEach(function(el,i) { el.classList.toggle("active", ["report","code","stdout","stderr"][i]===tab); });
  var state = detailState[id] || {open:true, tab:'code', codeExpanded:false};
  state.tab = tab;
  detailState[id] = state;
}

// ===== T-014 失败分析：失败记录按类型归类（超时 / 退出码非0 / 结果异常全零） =====
function classifyFailure(r) {
  if (r.timed_out) return 'timeout';
  if (r.exit_code !== 0) return 'exit';
  var m = /最大压力[：:]?\s*\**\s*([\d.eE+-]+)/.exec(r.stdout || '');
  if (m && parseFloat(m[1]) === 0) return 'zero';
  return null;
}

function revealFailure(id) {
  var detailRow = document.getElementById('detail-' + id);
  if (detailRow) {
    detailRow.classList.add('open');
    var state = detailState[id] || {open:false, tab:'code', codeExpanded:false};
    state.open = true;
    detailState[id] = state;
    detailRow.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }
}

function _faItem(r) {
  var summary = r.code ? smartSummary(r.code) : '（结果分析 · 无代码）';
  return '<div class="fa-item" onclick="revealFailure(' + r.id + ')" title="点击展开详情">'
    + '<span class="fa-id">#' + r.id + '</span>'
    + '<span class="fa-summary">' + esc(summary) + '</span>'
    + '<span class="fa-time">' + timeAgo(r.timestamp) + '</span>'
    + '</div>';
}

function renderFailAnalysis() {
  var ids = Object.keys(window.__execs || {});
  var buckets = { timeout: [], exit: [], zero: [] };
  ids.forEach(function(id) {
    var r = window.__execs[id];
    var cls = classifyFailure(r);
    if (cls) buckets[cls].push(r);
  });
  var any = false;
  ['timeout', 'exit', 'zero'].forEach(function(cls) {
    var list = buckets[cls];
    list.sort(function(a, b) { return b.id - a.id; });
    document.getElementById('fa-count-' + cls).textContent = list.length;
    var box = document.getElementById('fa-items-' + cls);
    if (list.length) {
      any = true;
      box.innerHTML = list.slice(0, 20).map(_faItem).join('');
    } else {
      box.innerHTML = '<div class="fa-empty">暂无</div>';
    }
  });
  document.getElementById('fail-analysis').style.display = any ? 'block' : 'none';
}

function _statusKey(r) {
  if (r.timed_out) return 'timeout';
  if (r.exit_code !== 0) return 'failed';
  var m = /最大压力[：:]?\s*\**\s*([\d.eE+-]+)/.exec(r.stdout || '');
  if (m && parseFloat(m[1]) === 0) return 'zero';
  return 'success';
}

function applyFilters() {
  var q = (document.getElementById('search-input').value || '').toLowerCase();
  var status = document.getElementById('status-filter').value;
  var ids = Object.keys(window.__execs || {}).map(Number).sort(function(a, b) { return b - a; });
  var rowsBox = document.getElementById('rows');
  var filtered = ids.filter(function(id) {
    var r = window.__execs[id];
    if (status !== 'all' && _statusKey(r) !== status) return false;
    if (!q) return true;
    var hay = [r.code, r.stdout, r.stderr, r.tool_name, String(r.id)].join(' ').toLowerCase();
    return hay.indexOf(q) !== -1;
  });
  document.getElementById('filter-count').textContent = filtered.length + ' 条';
  if (!filtered.length) {
    rowsBox.innerHTML = '<tr><td colspan="8" class="empty"><div class="icon">无匹配记录</div>没有符合当前筛选条件的记录。</td></tr>';
    return;
  }
  rowsBox.innerHTML = filtered.map(function(id) { return renderRow(window.__execs[id]); }).join('');
}

async function refresh() {
  try {
    var resp = await fetch("/dashboard/api/executions?since=" + lastId + "&analysis_since=" + lastAnalysisId + "&limit=100");
    var data = await resp.json();
    if (data.executions && data.executions.length > 0) {
      data.executions.forEach(function(r) { window.__execs[r.id] = r; });  // 缓存供对比
      lastId = Math.max(lastId, Math.max.apply(null, data.executions.map(function(r) { return r.id; })));
    }
    if (data.analysis_updates && data.analysis_updates.length > 0) {
      var executionsByRun = Object.create(null);
      Object.keys(window.__execs || {}).forEach(function(id) {
        var execution = window.__execs[id];
        if (execution.run_id) executionsByRun[execution.run_id] = execution;
      });
      data.analysis_updates.forEach(function(update) {
        lastAnalysisId = Math.max(lastAnalysisId, update.analysis_id || 0);
        if (executionsByRun[update.run_id]) executionsByRun[update.run_id].analysis = update;
      });
    }
    if (data.stats) {
      document.getElementById("stat-total").textContent = data.stats.total;
      document.getElementById("stat-ok").textContent = data.stats.success;
      document.getElementById("stat-fail").textContent = data.stats.failed;
      document.getElementById("stat-to").textContent = data.stats.timeout;
    }
    renderFailAnalysis();
    applyFilters();
    document.getElementById("live-dot").style.background = "var(--green)";
    document.getElementById("refresh-text").textContent = "自动刷新中";
  } catch(e) {
    document.getElementById("live-dot").style.background = "var(--red)";
    document.getElementById("refresh-text").textContent = "连接断开";
  }
}

document.addEventListener('click', function(e) {
  var img = e.target.closest('.gallery-thumb');
  if (!img) return;
  e.stopPropagation();
  showLightbox(img.src);
});

function showLightbox(src) {
  var old = document.getElementById('gallery-lightbox');
  if (old) old.remove();
  var lb = document.createElement('div');
  lb.id = 'gallery-lightbox';
  lb.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.9);z-index:9999;display:flex;align-items:center;justify-content:center;cursor:pointer;';
  lb.onclick = function() { lb.remove(); };
  var inner = document.createElement('img');
  inner.src = src;
  inner.style.cssText = 'max-width:90%;max-height:90%;border-radius:8px;box-shadow:0 0 40px rgba(0,0,0,0.5);';
  lb.appendChild(inner);
  document.body.appendChild(lb);
  document.addEventListener('keydown', function escFn(ev) { if (ev.key === 'Escape') { lb.remove(); document.removeEventListener('keydown', escFn); } });
}

refresh();
setInterval(refresh, 3000);

async function clearHistory() {
  var headers = adminHeaders(false);
  if (!headers) return;
  if (!confirm('确定要清空所有执行历史吗？此操作不可撤销。')) return;
  try {
    var resp = await fetch('/dashboard/api/executions', { method: 'DELETE', headers: headers });
    var data = await resp.json();
    if (data.ok) {
      document.getElementById('rows').innerHTML = '<tr><td colspan="5" class="empty">已清空 ' + data.deleted + ' 条记录</td></tr>';
      document.getElementById('stat-total').textContent = '0';
      document.getElementById('stat-ok').textContent = '0';
      document.getElementById('stat-fail').textContent = '0';
      document.getElementById('stat-to').textContent = '0';
      lastId = 0;
      firstLoad = true;
    }
  } catch(e) {
    alert('清空失败: ' + e);
  }
}
</script>
</body>
</html>
