name: Release container images

on:
  push:
    branches:
      - main
      - "feat/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  unit-tests:
    name: Full unit regression
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Build isolated test image
        run: docker build --build-arg INSTALL_DEV=true -t local/acouagent-tests:${{ github.sha }} .

      - name: Run full unit suite with production-like restrictions
        run: |
          docker run --rm \
            --network none \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=2g \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            -e MCP_AUTH_TOKEN="$(printf 'a%.0s' {1..40})" \
            -e EXECUTOR_SHARED_TOKEN="$(printf 'b%.0s' {1..40})" \
            -v "${{ github.workspace }}:/src:ro" \
            -w /src \
            local/acouagent-tests:${{ github.sha }} \
            python -m pytest -q -p no:cacheprovider

  release-manifest:
    name: Build release manifest
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Generate deterministic Git snapshot manifest
        run: |
          python3 scripts/validation/release_manifest.py \
            --ref HEAD \
            --output release-manifest.json
          python3 scripts/validation/release_manifest.py \
            --verify release-manifest.json

      - name: Upload release manifest
        uses: actions/upload-artifact@v4
        with:
          name: release-manifest-${{ github.sha }}
          path: release-manifest.json
          if-no-files-found: error
          retention-days: 14

  build:
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: gateway
            image: ghcr.io/mwxrookie/acouagent-gateway
            context: .
            file: Dockerfile
          - name: executor
            image: ghcr.io/mwxrookie/acouagent-executor
            context: executor
            file: executor/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image }}
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=raw,value=edge,enable={{is_default_branch}}

      - name: Build and optionally publish
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          provenance: mode=max
          sbom: true
