[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dify-mcp-server"
version = "0.1.0"
description = "AcouAgent MCP gateway for natural-language acoustic simulation"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastmcp-slim[server]==3.4.6",
    "numpy==2.1.3",
    "matplotlib==3.9.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1",
    "ruff>=0.12",
]

[tool.setuptools]
packages = [
    "app",
    "cores",
    "cores.local",
    "cores.dify",
    "cores.jwave_flow",
    "cores.jwave_flow.workflow",
    "cores.jwave_flow.bridge",
]

[tool.setuptools.package-data]
app = ["web/*.html"]
cores.jwave_flow = ["kb/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["."]
markers = [
    "integration: tests that require a running gateway or external services",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
