# Optional source-build fallback. The base stack pulls prebuilt GHCR images.
# Usage:
#   docker compose -f compose.yaml -f deploy/compose.build.yaml up -d --build
services:
  jwave-executor:
    build:
      context: ./executor
      dockerfile: Dockerfile
  dify-mcp:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_MODULE: app.server_safe
  skill-bootstrap:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_MODULE: app.server_safe
